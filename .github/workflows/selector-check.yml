name: Weekly Selector Health Check

on:
  schedule:
    # Every Monday at 07:30 UTC (08:30 CET / 09:30 CEST)
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-selectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run selector health check
        id: check
        continue-on-error: true
        env:
          SELECTOR_REPORT_PATH: selector-report.json
        run: |
          node .github/scripts/check-selectors.js

      - name: Report broken selectors via GitHub Issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('selector-report.json')) return;
            const report = JSON.parse(fs.readFileSync('selector-report.json', 'utf8'));
            const failures = report.failures || [];
            if (failures.length === 0) return;

            const title = '⚠️ Selector health check: broken login selector detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const rows = failures
              .map((f) => `- **${f.label}** (\`${f.siteKey}\` — ${f.url}): ${f.reason}`)
              .join('\n');

            const body = [
              'The weekly automated selector health check detected that one or more KIT login pages did not match their expected CSS selectors:',
              '',
              rows,
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            // Avoid creating duplicate open issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });

            const openIssue = existing.data.find((i) => i.title === title);
            if (openIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail job if selectors broke
        if: steps.check.outcome == 'failure'
        run: exit 1
