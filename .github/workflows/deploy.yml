name: Publish to AMO, Chrome Web Store & GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Chrome ZIP
        run: |
          mkdir -p artifacts
          zip -r artifacts/kit_auto_login-chrome.zip \
            manifest.json icons/ options/ scripts/

      - name: Upload Chrome ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chrome-zip
          path: artifacts/kit_auto_login-chrome.zip

  firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Sign and Publish to AMO
        id: sign
        run: |
          web-ext sign \
            --channel=listed \
            --source-dir=. \
            --ignore-files "kit_auto_login_userscript.js" "README.md" ".gitignore" "xpi/" \
            --api-key=${{ secrets.AMO_JWT_ISSUER }} \
            --api-secret=${{ secrets.AMO_JWT_SECRET }} \
            --artifacts-dir=./web-ext-artifacts

      - name: Rename XPI
        run: |
          cd web-ext-artifacts
          for f in *.xpi; do mv "$f" "${f%.xpi}-firefox.xpi"; done

      - name: Upload Firefox XPI
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: web-ext-artifacts/*.xpi

  chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Chrome ZIP
        uses: actions/download-artifact@v4
        with:
          name: chrome-zip

      - name: Install chrome-webstore-upload-cli
        run: npm install --global chrome-webstore-upload-cli

      - name: Upload & Publish to Chrome Web Store
        run: |
          chrome-webstore-upload upload \
            --source kit_auto_login-chrome.zip \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}

          chrome-webstore-upload publish \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}

  release:
    needs: [firefox, chrome]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Firefox XPI
        uses: actions/download-artifact@v4
        with:
          name: firefox-xpi
          path: artifacts

      - name: Download Chrome ZIP
        uses: actions/download-artifact@v4
        with:
          name: chrome-zip
          path: artifacts

      - name: Extract Release Notes
        id: extract_notes
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*
            kit_auto_login_userscript.js
          body_path: RELEASE_NOTES.md