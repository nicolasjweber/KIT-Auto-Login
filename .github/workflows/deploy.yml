name: Publish to AMO & GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sign-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Sign and Publish
        id: sign
        run: |
          web-ext sign \
            --channel=listed \
            --source-dir=. \
            --ignore-files "kit_auto_login_userscript.js" "README.md" ".gitignore" "xpi/" \
            --api-key=${{ secrets.AMO_JWT_ISSUER }} \
            --api-secret=${{ secrets.AMO_JWT_SECRET }} \
            --artifacts-dir=./web-ext-artifacts

      - name: Rename XPI
        run: |
          cd web-ext-artifacts
          for f in *.xpi; do mv "$f" "${f%.xpi}-firefox.xpi"; done

      - name: Extract Release Notes
        id: extract_notes
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            web-ext-artifacts/*.xpi
            kit_auto_login_userscript.js
          body_path: RELEASE_NOTES.md


  chrome-submit:
    runs-on: ubuntu-latest
    needs: sign-and-submit # Wait for the release to be created first
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Zip for Chrome
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          zip -r extension.zip . -x "*.git*" "*.github*" "web-ext-artifacts/*" "kit_auto_login_userscript.js" "README.md" ".gitignore" "xpi/*"
          cp extension.zip "kit_auto_login-${VERSION}-chrome.zip"

      - name: Upload to Chrome Web Store
        uses: mobilefirstllc/cws-publish@v2.1.2
        with:
          action: 'publish' # Uploads AND publishes immediately
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: extension.zip

      - name: Add Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: kit_auto_login-*-chrome.zip